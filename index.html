<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables de Multiplication</title>
  <meta name="description" content="Entraîne-toi aux tables de multiplication avec un rapport d'erreurs.">
  <meta name="theme-color" content="#1A0A2E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<div class="stars" id="stars"></div>

<div class="burst-container" id="burst"></div>

<div class="container">
  <div class="header">
    <div class="version-badge" id="app-version">v0.0.0</div>
    <h1>⭐ Tables de Multiplication</h1>
    <p>Entraîne-toi et deviens un champion des maths !</p>
  </div>

  <!-- SCREEN 1 : Settings -->
  <div class="screen active" id="screen-settings">
    <div class="settings-panel">
      <h2>Choisir les tables</h2>
      <div class="tables-grid" id="tables-grid"></div>
      <div class="settings-actions">
        <button class="btn-select-all" id="select-all-btn">Tout sélectionner</button>
        <button class="btn-deselect" id="deselect-btn">Tout décocher</button>
      </div>
    </div>
    <button class="start-btn" id="start-btn">🚀 Commencer !</button>
  </div>

  <!-- SCREEN 2 : Game -->
  <div class="screen" id="screen-game">
    <div class="progress-wrap">
      <div class="progress-info">
        <span>Progression</span>
        <strong id="progress-text">0 / 0</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="score-row">
      <div class="score-card correct"><div class="num" id="score-correct" aria-label="Réponses correctes">0</div><div class="lbl" aria-hidden="true">✅ Corrects</div></div>
      <div class="score-card wrong"><div class="num" id="score-wrong" aria-label="Erreurs">0</div><div class="lbl" aria-hidden="true">❌ Erreurs</div></div>
      <div class="score-card remaining"><div class="num" id="score-remaining" aria-label="Questions restantes">0</div><div class="lbl" aria-hidden="true">🔢 Restantes</div></div>
    </div>

    <div class="question-card" id="question-card">
      <span class="mascot" id="mascot" aria-hidden="true">🦊</span>
      <div class="question-text" id="question-text" aria-live="polite"></div>
      <div class="answer-wrap" id="answer-wrap">
        <input class="answer-input" id="answer-input" name="answer-input" type="text" inputmode="none" pattern="[0-9]*" min="0" max="999" placeholder="?" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse" readonly tabindex="-1">
        <button class="submit-btn" id="submit-btn" name="submit-answer" aria-label="Valider la réponse">OK ✓</button>
      </div>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <button class="next-btn" id="next-btn">Question suivante →</button>

    <!-- Numpad for mobile ease -->
    <div class="numpad" id="numpad">
      <button class="numpad-btn" data-key="7">7</button>
      <button class="numpad-btn" data-key="8">8</button>
      <button class="numpad-btn" data-key="9">9</button>
      <button class="numpad-btn" data-key="4">4</button>
      <button class="numpad-btn" data-key="5">5</button>
      <button class="numpad-btn" data-key="6">6</button>
      <button class="numpad-btn" data-key="1">1</button>
      <button class="numpad-btn" data-key="2">2</button>
      <button class="numpad-btn" data-key="3">3</button>
      <button class="numpad-btn clear" data-key="clear">C</button>
      <button class="numpad-btn" data-key="0">0</button>
      <button class="numpad-btn del" data-key="del">⌫</button>
    </div>

    <button class="ghost-link" id="go-home-game">← Changer les tables</button>
  </div>

  <!-- SCREEN 3 : Results -->
  <div class="screen" id="screen-results">
    <div class="results-screen">
      <div class="big-emoji" id="result-emoji">🏆</div>
      <h2 id="result-title">Bravo !</h2>
      <p id="result-subtitle"></p>
      <div class="results-grid">
        <div class="result-item"><div class="n g" id="res-correct">0</div><div class="l">✅ Corrects</div></div>
        <div class="result-item"><div class="n r" id="res-wrong">0</div><div class="l">❌ Erreurs</div></div>
        <div class="result-item result-item--wide"><div class="n" id="res-rate">0%</div><div class="l">🎯 Taux de réussite</div></div>
      </div>

      <div class="table-summary" id="table-summary">
        <h3>📊 Bilan par table</h3>
        <div id="table-summary-list"></div>
      </div>

      <div class="error-report" id="error-report">
        <h3>📋 Multiplications à revoir</h3>
        <div class="error-list" id="error-list"></div>
      </div>

      <div class="results-actions">
        <button class="action-btn review" id="review-btn">🔁 Réviser mes erreurs</button>
        <button class="action-btn print" id="print-btn">🖨️ Imprimer le rapport</button>
      </div>

      <button class="restart-btn" id="restart-btn">🔄 Recommencer</button>
      <button class="ghost-link results" id="go-home-results">← Choisir d'autres tables</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
