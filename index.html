<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables de Multiplication</title>
<meta name="description" content="Entraine-toi aux tables de multiplication avec un rapport d'erreurs.">
<meta name="theme-color" content="#1A0A2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1A0A2E;
    --card: #2D1553;
    --yellow: #FFD60A;
    --purple-light: #F0E6FF;
    --green: #4ADE80;
    --red: #FF6B6B;
    --blue: #60A5FA;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    color: var(--purple-light);
    overflow-x: hidden;
  }

  /* Stars background */
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--d) ease-in-out infinite var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--op); transform: scale(1); }
  }

  /* Layout */
  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 540px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  /* Header */
  .header {
    text-align: center;
  }
  .header h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 900;
    color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,214,10,0.4);
    letter-spacing: -0.5px;
  }
  .header p { font-size: 0.9rem; color: #9B7CC8; margin-top: 4px; }

  /* Settings panel */
  .settings-panel {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    border: 1px solid #3D1F72;
  }
  .settings-panel h2 {
    font-size: 1rem; font-weight: 800; color: var(--yellow);
    margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px;
  }
  .tables-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  }
  .table-btn {
    background: #1A0A2E; border: 2px solid #3D1F72; border-radius: 12px;
    color: var(--purple-light); font-family: 'Nunito', sans-serif;
    font-size: 1.1rem; font-weight: 800; padding: 10px 0;
    cursor: pointer; transition: all 0.15s;
  }
  .table-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .table-btn.active {
    background: var(--yellow); color: #1A0A2E; border-color: var(--yellow);
    box-shadow: 0 0 12px rgba(255,214,10,0.4);
  }
  .settings-actions {
    display: flex; gap: 10px; margin-top: 14px;
  }
  .btn-select-all, .btn-deselect {
    flex: 1; padding: 8px; border-radius: 10px; border: none;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-select-all { background: #3D1F72; color: var(--purple-light); }
  .btn-select-all:hover { background: #5B2DA0; }
  .btn-deselect { background: #2D1553; color: #9B7CC8; }
  .btn-deselect:hover { background: #3D1F72; }
  .start-btn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: var(--yellow); color: #1A0A2E;
    font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: 900;
    cursor: pointer; transition: all 0.2s; margin-top: 6px;
    box-shadow: 0 4px 20px rgba(255,214,10,0.3);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,214,10,0.45); }
  .start-btn:active { transform: translateY(0); }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
  }
  .progress-info {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; color: #9B7CC8; margin-bottom: 6px;
  }
  .progress-info strong { color: var(--purple-light); }
  .progress-bar {
    width: 100%; height: 10px; background: #2D1553; border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--yellow));
    border-radius: 999px; transition: width 0.5s ease;
  }

  /* Score row */
  .score-row {
    display: flex; gap: 12px; width: 100%;
  }
  .score-card {
    flex: 1; background: var(--card); border-radius: 16px; padding: 14px;
    text-align: center; border: 1px solid #3D1F72;
  }
  .score-card .num { font-size: 1.8rem; font-weight: 900; }
  .score-card .lbl { font-size: 0.75rem; color: #9B7CC8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .score-card.correct .num { color: var(--green); }
  .score-card.wrong .num { color: var(--red); }
  .score-card.remaining .num { color: var(--blue); }

  /* Question card */
  .question-card {
    background: var(--card); border-radius: 24px; padding: 36px 28px;
    width: 100%; text-align: center; border: 1px solid #3D1F72;
    position: relative; overflow: hidden;
  }
  .mascot {
    font-size: 3rem; margin-bottom: 8px;
    display: block; transition: transform 0.3s;
  }
  .question-text {
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 900;
    color: white;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 24px;
  }
  .question-text .op-symbol { color: var(--yellow); }
  .question-text .equals { color: #9B7CC8; }

  /* Answer input */
  .answer-wrap { display: flex; gap: 10px; width: 100%; }
  .answer-input {
    flex: 1; background: #1A0A2E; border: 2px solid #3D1F72;
    border-radius: 14px; padding: 14px 18px;
    font-family: 'Nunito', sans-serif; font-size: 1.5rem; font-weight: 800;
    color: white; text-align: center; outline: none; transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .answer-input::-webkit-inner-spin-button, .answer-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .answer-input:focus { border-color: var(--yellow); }
  .answer-input.correct-input { border-color: var(--green); background: rgba(74,222,128,0.08); }
  .answer-input.wrong-input { border-color: var(--red); background: rgba(255,107,107,0.08); }

  .submit-btn {
    background: var(--yellow); color: #1A0A2E; border: none;
    border-radius: 14px; padding: 14px 20px;
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 900;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(255,214,10,0.3);
  }
  .submit-btn:hover { transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Feedback */
  .feedback {
    font-size: 1.1rem; font-weight: 800; min-height: 1.6em;
    text-align: center; transition: opacity 0.2s;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  /* Next btn */
  .next-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: #3D1F72; color: var(--purple-light);
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s; display: none;
  }
  .next-btn.visible { display: block; }
  .next-btn:hover { background: #5B2DA0; }

  /* Numpad */
  .numpad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
  }
  .numpad-btn {
    background: var(--card); border: 1px solid #3D1F72; border-radius: 12px;
    color: var(--purple-light); font-family: 'Nunito', sans-serif;
    font-size: 1.3rem; font-weight: 800; padding: 16px 0;
    cursor: pointer; transition: all 0.1s;
  }
  .numpad-btn:hover { background: #3D1F72; border-color: var(--yellow); }
  .numpad-btn:active { transform: scale(0.96); }
  .numpad-btn.del { color: var(--red); }
  .numpad-btn.ok { background: var(--yellow); color: #1A0A2E; border-color: var(--yellow); }
  .numpad-btn.ok:hover { box-shadow: 0 0 12px rgba(255,214,10,0.4); }

  /* Results screen */
  .results-screen {
    background: var(--card); border-radius: 24px; padding: 36px 28px;
    width: 100%; text-align: center; border: 1px solid #3D1F72;
  }
  .results-screen .big-emoji { font-size: 4rem; margin-bottom: 12px; }
  .results-screen h2 { font-size: 1.8rem; font-weight: 900; color: var(--yellow); margin-bottom: 8px; }
  .results-screen p { color: #9B7CC8; margin-bottom: 20px; }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .result-item {
    background: #1A0A2E; border-radius: 14px; padding: 14px;
  }
  .result-item .n { font-size: 2rem; font-weight: 900; }
  .result-item .n.g { color: var(--green); }
  .result-item .n.r { color: var(--red); }
  .result-item .l { font-size: 0.75rem; color: #9B7CC8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .restart-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: var(--yellow); color: #1A0A2E;
    font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(255,214,10,0.3);
  }
  .restart-btn:hover { transform: translateY(-2px); }

  /* Error report */
  .error-report {
    width: 100%;
    text-align: left;
    margin-bottom: 24px;
  }
  .error-report h3 {
    font-size: 1rem; font-weight: 800; color: var(--red);
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    text-align: center;
  }
  .error-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 260px; overflow-y: auto;
  }
  .error-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #1A0A2E; border: 1px solid #3D1F72; border-radius: 12px;
    padding: 10px 14px;
  }
  .error-row .op {
    font-size: 1.1rem; font-weight: 800; color: white;
  }
  .error-row .op .x { color: var(--yellow); }
  .error-row .op .res { color: var(--green); }
  .error-row .count {
    font-size: 0.8rem; font-weight: 800; color: var(--red);
    background: rgba(255,107,107,0.12); border-radius: 999px;
    padding: 4px 12px; white-space: nowrap;
  }
  .no-errors {
    text-align: center; color: var(--green); font-weight: 800;
    padding: 14px; font-size: 1.05rem;
  }
  .error-row .time {
    font-size: 0.72rem; color: #9B7CC8; font-weight: 700;
    margin-left: 8px;
  }

  /* Per-table summary */
  .table-summary {
    width: 100%; text-align: left; margin-bottom: 24px;
  }
  .table-summary h3 {
    font-size: 1rem; font-weight: 800; color: var(--blue);
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    text-align: center;
  }
  .table-summary-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .table-summary-row .tname {
    font-size: 0.9rem; font-weight: 800; color: var(--purple-light);
    width: 78px; white-space: nowrap;
  }
  .table-summary-row .tbar {
    flex: 1; height: 12px; background: #1A0A2E; border-radius: 999px; overflow: hidden;
  }
  .table-summary-row .tbar-fill {
    height: 100%; border-radius: 999px; transition: width 0.4s ease;
  }
  .table-summary-row .tpct {
    font-size: 0.78rem; font-weight: 800; width: 40px; text-align: right;
  }

  /* Secondary action buttons on results */
  .results-actions {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
  }
  .action-btn {
    width: 100%; padding: 12px; border-radius: 14px; border: none;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
  }
  .action-btn.review { background: var(--red); color: #1A0A2E; }
  .action-btn.review:hover { transform: translateY(-2px); }
  .action-btn.review:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .action-btn.print { background: #3D1F72; color: var(--purple-light); }
  .action-btn.print:hover { background: #5B2DA0; }

  /* Persistent history badge on error rows */
  .error-row .history {
    font-size: 0.68rem; color: #C89BEA; font-weight: 700;
    background: rgba(96,165,250,0.12); border-radius: 999px;
    padding: 3px 9px; white-space: nowrap; margin-left: 6px;
  }

  @media print {
    body { background: white; color: black; }
    .stars, .burst-container, .results-actions, .restart-btn,
    .screen:not(.active) { display: none !important; }
    .results-screen { border: none; background: white; }
  }



  /* Burst animation */
  .burst-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .burst-particle {
    position: absolute;
    width: 10px; height: 10px; border-radius: 50%;
    animation: burst 0.8s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Shake */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* Hidden / screen management */
  .screen { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .screen.active { display: flex; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="burst-container" id="burst"></div>

<div class="container">
  <div class="header">
    <h1>⭐ Tables de Multiplication</h1>
    <p>Entraîne-toi et deviens un champion des maths !</p>
  </div>

  <!-- SCREEN 1 : Settings -->
  <div class="screen active" id="screen-settings">
    <div class="settings-panel">
      <h2>Choisir les tables</h2>
      <div class="tables-grid" id="tables-grid"></div>
      <div class="settings-actions">
        <button class="btn-select-all" onclick="selectAll()">Tout sélectionner</button>
        <button class="btn-deselect" onclick="deselectAll()">Tout décocher</button>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()">🚀 Commencer !</button>
  </div>

  <!-- SCREEN 2 : Game -->
  <div class="screen" id="screen-game">
    <div class="progress-wrap">
      <div class="progress-info">
        <span>Progression</span>
        <strong id="progress-text">0 / 0</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div class="score-row">
      <div class="score-card correct"><div class="num" id="score-correct" aria-label="Réponses correctes">0</div><div class="lbl" aria-hidden="true">✅ Corrects</div></div>
      <div class="score-card wrong"><div class="num" id="score-wrong" aria-label="Erreurs">0</div><div class="lbl" aria-hidden="true">❌ Erreurs</div></div>
      <div class="score-card remaining"><div class="num" id="score-remaining" aria-label="Questions restantes">0</div><div class="lbl" aria-hidden="true">🔢 Restantes</div></div>
    </div>

    <div class="question-card" id="question-card">
      <span class="mascot" id="mascot" aria-hidden="true">🦊</span>
      <div class="question-text" id="question-text" aria-live="polite"></div>
      <div class="answer-wrap">
        <input class="answer-input" id="answer-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" placeholder="?" autocomplete="off" aria-label="Ta réponse">
        <button class="submit-btn" id="submit-btn" onclick="checkAnswer()" aria-label="Valider la réponse">OK ✓</button>
      </div>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Question suivante →</button>

    <!-- Numpad for mobile ease -->
    <div class="numpad" id="numpad">
      <button class="numpad-btn" onclick="numpadPress('7')">7</button>
      <button class="numpad-btn" onclick="numpadPress('8')">8</button>
      <button class="numpad-btn" onclick="numpadPress('9')">9</button>
      <button class="numpad-btn" onclick="numpadPress('4')">4</button>
      <button class="numpad-btn" onclick="numpadPress('5')">5</button>
      <button class="numpad-btn" onclick="numpadPress('6')">6</button>
      <button class="numpad-btn" onclick="numpadPress('1')">1</button>
      <button class="numpad-btn" onclick="numpadPress('2')">2</button>
      <button class="numpad-btn" onclick="numpadPress('3')">3</button>
      <button class="numpad-btn del" onclick="numpadPress('del')">⌫</button>
      <button class="numpad-btn" onclick="numpadPress('0')">0</button>
      <button class="numpad-btn ok" onclick="checkAnswer()">✓</button>
    </div>

    <button style="background:none;border:none;color:#9B7CC8;font-family:'Nunito',sans-serif;font-size:0.85rem;cursor:pointer;margin-top:4px;" onclick="goHome()">← Changer les tables</button>
  </div>

  <!-- SCREEN 3 : Results -->
  <div class="screen" id="screen-results">
    <div class="results-screen">
      <div class="big-emoji" id="result-emoji">🏆</div>
      <h2 id="result-title">Bravo !</h2>
      <p id="result-subtitle"></p>
      <div class="results-grid">
        <div class="result-item"><div class="n g" id="res-correct">0</div><div class="l">✅ Corrects</div></div>
        <div class="result-item"><div class="n r" id="res-wrong">0</div><div class="l">❌ Erreurs</div></div>
        <div class="result-item" style="grid-column:span 2"><div class="n" id="res-rate" style="color:var(--yellow)">0%</div><div class="l">🎯 Taux de réussite</div></div>
      </div>

      <div class="table-summary" id="table-summary">
        <h3>📊 Bilan par table</h3>
        <div id="table-summary-list"></div>
      </div>

      <div class="error-report" id="error-report">
        <h3>📋 Multiplications à revoir</h3>
        <div class="error-list" id="error-list"></div>
      </div>

      <div class="results-actions">
        <button class="action-btn review" id="review-btn" onclick="reviewErrors()">🔁 Réviser mes erreurs</button>
        <button class="action-btn print" onclick="window.print()">🖨️ Imprimer le rapport</button>
      </div>

      <button class="restart-btn" onclick="restartGame()" style="margin-top:12px;">🔄 Recommencer</button>
      <button style="background:none;border:none;color:#9B7CC8;font-family:'Nunito',sans-serif;font-size:0.9rem;cursor:pointer;margin-top:14px;display:block;width:100%;" onclick="goHome()">← Choisir d'autres tables</button>

    </div>
  </div>
</div>

<script>
// ─── Stars background ───────────────────────────────────────
(function() {
  const wrap = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      --delay:${(Math.random()*4).toFixed(1)}s;
      --op:${(Math.random()*0.6+0.2).toFixed(2)};
    `;
    wrap.appendChild(s);
  }
})();

// ─── Game state ──────────────────────────────────────────────
let selectedTables = [2, 3, 4, 5];
let queue = [];         // operations to ask (not yet answered correctly)
let wrongSet = new Set(); // "a×b" strings that were wrong at least once
let errorCounts = {}; // "a×b" -> number of errors made on this operation
let slowSet = new Set(); // "a×b" answered correctly but slowly (>SLOW_MS)
let opTimes = {}; // "a×b" -> best (fastest) correct answer time in ms
let tableStats = {}; // table number -> { asked, correct }
let scoreCorrect = 0;
let scoreWrong = 0;
let totalOps = 0;
let currentOp = null;
let answered = false;
let questionStart = 0; // timestamp when the current question was shown

const SLOW_MS = 5000; // above this a correct answer is flagged "hesitant"
const HISTORY_KEY = 'tm_error_history_v1'; // localStorage key

const mascots = ['🦊','🐸','🦁','🐼','🦄','🐯','🐧','🦋'];
let mascotIdx = 0;

// ─── Persistent history (localStorage) ───────────────────────
function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function saveHistory(hist) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  } catch (e) { /* storage unavailable, ignore */ }
}
// Merge this session's errors into the long-term history.
function persistSessionErrors() {
  const hist = loadHistory();
  for (const [key, count] of Object.entries(errorCounts)) {
    hist[key] = (hist[key] || 0) + count;
  }
  saveHistory(hist);
}


// ─── Init tables buttons ─────────────────────────────────────
(function initTables() {
  const grid = document.getElementById('tables-grid');
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'table-btn' + (selectedTables.includes(i) ? ' active' : '');
    btn.textContent = i;
    btn.dataset.table = i;
    btn.onclick = () => toggleTable(i, btn);
    grid.appendChild(btn);
  }
})();

function toggleTable(n, btn) {
  if (selectedTables.includes(n)) {
    if (selectedTables.length === 1) return; // at least one
    selectedTables = selectedTables.filter(x => x !== n);
    btn.classList.remove('active');
  } else {
    selectedTables.push(n);
    btn.classList.add('active');
  }
}
function selectAll() {
  selectedTables = Array.from({length:10},(_,i)=>i+1);
  document.querySelectorAll('.table-btn').forEach(b => b.classList.add('active'));
}
function deselectAll() {
  selectedTables = [selectedTables[0] || 2];
  document.querySelectorAll('.table-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.table === selectedTables[0]);
  });
}

// ─── Build the full operation pool ───────────────────────────
function buildQueue() {
  const ops = [];
  for (const t of selectedTables) {
    for (let i = 1; i <= 10; i++) {
      ops.push([t, i]);
    }
  }
  return shuffle(ops);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── Screen management ───────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── Start / Home ────────────────────────────────────────────
// customQueue: optional array of [a, b] pairs (used by "review errors" mode).
function startGame(customQueue) {
  if (!customQueue && selectedTables.length === 0) return;
  queue = customQueue ? shuffle(customQueue) : buildQueue();
  wrongSet = new Set();
  errorCounts = {};
  slowSet = new Set();
  opTimes = {};
  tableStats = {};
  scoreCorrect = 0; scoreWrong = 0;
  totalOps = queue.length;
  mascotIdx = 0;
  updateScoreDisplay();
  showScreen('screen-game');
  nextQuestion();
}

function goHome() {
  showScreen('screen-settings');
}

function restartGame() {
  startGame();
}

// Replay a session made only of the operations missed (wrong or slow)
// during the round that just finished.
function reviewErrors() {
  const keys = new Set([...Object.keys(errorCounts), ...slowSet]);
  const ops = [...keys].map(k => k.split('×').map(Number));
  if (ops.length === 0) return;
  startGame(ops);
}


// ─── Question flow ───────────────────────────────────────────
function nextQuestion() {
  if (queue.length === 0) {
    showResults();
    return;
  }
  answered = false;
  currentOp = queue.shift();

  const input = document.getElementById('answer-input');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').classList.remove('visible');

  // Render question
  document.getElementById('question-text').innerHTML =
    `${currentOp[0]} <span class="op-symbol">×</span> ${currentOp[1]} <span class="equals">=</span>`;

  // Rotate mascot
  document.getElementById('mascot').textContent = mascots[mascotIdx % mascots.length];
  mascotIdx++;

  questionStart = Date.now();
  updateProgress();
  input.focus();
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('answer-input');
  const val = input.value.trim();
  if (val === '') return;

  const userAnswer = parseInt(val, 10);
  const correctAnswer = currentOp[0] * currentOp[1];
  const key = `${currentOp[0]}×${currentOp[1]}`;
  const elapsed = Date.now() - questionStart;
  const table = currentOp[0];
  answered = true;
  input.disabled = true;
  document.getElementById('submit-btn').disabled = true;

  // Per-table statistics (count each attempt).
  if (!tableStats[table]) tableStats[table] = { asked: 0, correct: 0 };
  tableStats[table].asked++;

  if (userAnswer === correctAnswer) {
    // Correct !
    scoreCorrect++;
    wrongSet.delete(key);
    tableStats[table].correct++;
    // Record best (fastest) time for this operation.
    if (!(key in opTimes) || elapsed < opTimes[key]) opTimes[key] = elapsed;
    // Flag hesitant answers (correct but slow) for the review list.
    if (elapsed > SLOW_MS) slowSet.add(key); else slowSet.delete(key);
    input.classList.add('correct-input');
    const slowNote = elapsed > SLOW_MS ? ' (un peu lent 🐢)' : '';
    document.getElementById('feedback').textContent = `✅ Bravo ! ${currentOp[0]} × ${currentOp[1]} = ${correctAnswer}${slowNote}`;
    document.getElementById('feedback').className = 'feedback correct';
    document.getElementById('mascot').textContent = '🎉';
    triggerBurst(true);
    setTimeout(() => nextQuestion(), 1100);
  } else {
    // Wrong !
    scoreWrong++;
    wrongSet.add(key);
    errorCounts[key] = (errorCounts[key] || 0) + 1;
    input.classList.add('wrong-input');

    document.getElementById('feedback').innerHTML = `❌ Pas tout à fait… La réponse était <strong style="color:var(--yellow)">${correctAnswer}</strong>`;
    document.getElementById('feedback').className = 'feedback wrong';
    document.getElementById('mascot').textContent = '😬';
    document.getElementById('question-card').classList.add('shake');
    setTimeout(() => document.getElementById('question-card').classList.remove('shake'), 400);
    // Re-add to queue
    const pos = Math.floor(Math.random() * Math.min(4, queue.length + 1)) + 1;
    queue.splice(pos, 0, currentOp);
  }

  updateScoreDisplay();
  document.getElementById('next-btn').classList.add('visible');
}

// ─── UI updates ──────────────────────────────────────────────
function updateProgress() {
  const done = totalOps + wrongSet.size - queue.length;
  const total = totalOps + wrongSet.size;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('score-remaining').textContent = queue.length;
}

function updateScoreDisplay() {
  document.getElementById('score-correct').textContent = scoreCorrect;
  document.getElementById('score-wrong').textContent = scoreWrong;
  document.getElementById('score-remaining').textContent = queue.length;
  updateProgress();
}

// ─── Results ─────────────────────────────────────────────────
function showResults() {
  const total = scoreCorrect + scoreWrong;
  const rate = total > 0 ? Math.round((scoreCorrect / total) * 100) : 100;
  document.getElementById('res-correct').textContent = scoreCorrect;
  document.getElementById('res-wrong').textContent = scoreWrong;
  document.getElementById('res-rate').textContent = rate + '%';

  let emoji, title, sub;
  if (rate === 100) { emoji='🏆'; title='Parfait !'; sub='Tu as tout bon du premier coup, champion !'; }
  else if (rate >= 80) { emoji='⭐'; title='Excellent !'; sub=`${rate}% de réussite, c'est super !`; }
  else if (rate >= 60) { emoji='👍'; title='Bien joué !'; sub=`${rate}% de réussite, continue à t'entraîner !`; }
  else { emoji='💪'; title='Courage !'; sub=`${rate}% — pratique encore, tu vas y arriver !`; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = sub;

  // Persist this session's errors into the long-term history before
  // rendering (so the report can show cumulative counts).
  persistSessionErrors();

  renderTableSummary();
  renderErrorReport();

  // The "review my errors" button is only useful when something was missed.
  const hasMisses = Object.keys(errorCounts).length > 0 || slowSet.size > 0;
  document.getElementById('review-btn').disabled = !hasMisses;

  showScreen('screen-results');
  triggerBurst(rate >= 80);
}

// ─── Per-table summary ───────────────────────────────────────
function renderTableSummary() {
  const wrap = document.getElementById('table-summary-list');
  const summaryBlock = document.getElementById('table-summary');
  wrap.innerHTML = '';

  const tables = Object.keys(tableStats).map(Number).sort((a, b) => a - b);
  if (tables.length === 0) {
    summaryBlock.style.display = 'none';
    return;
  }
  summaryBlock.style.display = '';

  for (const t of tables) {
    const { asked, correct } = tableStats[t];
    const pct = asked > 0 ? Math.round((correct / asked) * 100) : 100;
    // Colour the bar from red (weak) to green (strong).
    const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
    const row = document.createElement('div');
    row.className = 'table-summary-row';
    row.innerHTML =
      `<span class="tname">Table de ${t}</span>` +
      `<span class="tbar"><span class="tbar-fill" style="width:${pct}%;background:${color}"></span></span>` +
      `<span class="tpct" style="color:${color}">${pct}%</span>`;
    wrap.appendChild(row);
  }
}

// ─── Error report ────────────────────────────────────────────
function fmtTime(ms) {
  return (ms / 1000).toFixed(1).replace('.', ',') + ' s';
}

function renderErrorReport() {
  const listEl = document.getElementById('error-list');
  listEl.innerHTML = '';

  const history = loadHistory();

  // Operations to review: wrong at least once, OR correct but slow.
  const keys = new Set([...Object.keys(errorCounts), ...slowSet]);

  if (keys.size === 0) {
    listEl.innerHTML = '<div class="no-errors">🎉 Aucune erreur, bravo !</div>';
    return;
  }

  // Sort: most errors first, then slowest.
  const entries = [...keys].sort((ka, kb) => {
    const ea = errorCounts[ka] || 0, eb = errorCounts[kb] || 0;
    if (eb !== ea) return eb - ea;
    return (opTimes[kb] || 0) - (opTimes[ka] || 0);
  });

  for (const key of entries) {
    // key is "a×b"
    const [a, b] = key.split('×').map(Number);
    const result = a * b;
    const count = errorCounts[key] || 0;
    const row = document.createElement('div');
    row.className = 'error-row';

    // Right-side badge: either an error count, or a "hesitant" flag.
    let badge;
    if (count > 0) {
      badge = `<span class="count">${count > 1 ? count + ' erreurs' : '1 erreur'}</span>`;
    } else {
      badge = `<span class="count" style="color:var(--yellow);background:rgba(255,214,10,0.12)">🐢 hésitation</span>`;
    }

    // Best time recorded this session (if the op was ever answered).
    const timeNote = key in opTimes
      ? `<span class="time">⏱ ${fmtTime(opTimes[key])}</span>` : '';

    // Cumulative errors across all past sessions.
    const histNote = history[key]
      ? `<span class="history">total : ${history[key]}</span>` : '';

    row.innerHTML =
      `<span class="op">${a} <span class="x">×</span> ${b} = <span class="res">${result}</span>${timeNote}</span>` +
      `<span style="display:flex;align-items:center">${histNote}${badge}</span>`;
    listEl.appendChild(row);
  }
}



// ─── Numpad ──────────────────────────────────────────────────
function numpadPress(k) {
  if (answered) return;
  const input = document.getElementById('answer-input');
  if (k === 'del') {
    input.value = input.value.slice(0, -1);
  } else {
    if (input.value.length >= 3) return;
    input.value += k;
  }
  input.focus();
}

// ─── Burst ───────────────────────────────────────────────────
function triggerBurst(positive) {
  const wrap = document.getElementById('burst');
  wrap.innerHTML = '';
  const colors = positive
    ? ['#FFD60A','#4ADE80','#60A5FA','#F472B6','#FBBF24']
    : ['#FF6B6B','#F87171','#FCA5A5'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const n = positive ? 28 : 12;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'burst-particle';
    const angle = (i / n) * 360;
    const dist = positive ? (80 + Math.random() * 160) : (40 + Math.random() * 80);
    const rad = angle * Math.PI / 180;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      background:${colors[i % colors.length]};
      width:${positive ? 10 : 7}px; height:${positive ? 10 : 7}px;
      --dx:${Math.cos(rad)*dist}px; --dy:${Math.sin(rad)*dist}px;
      animation-duration:${positive ? 0.9 : 0.6}s;
    `;
    wrap.appendChild(p);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 1000);
}

// ─── Keyboard ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (answered) nextQuestion();
    else checkAnswer();
  }
});

// ─── Service worker registration (PWA / offline) ─────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}
</script>
